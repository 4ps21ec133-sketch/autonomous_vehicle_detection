
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Autonomous Vehicle Detection</title>

<!-- ONNX Runtime WebGPU -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.webgpu.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101820;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    background: #172b3a;
    padding: 15px;
}

h1 {
    color: #00d4ff;
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 12px;
}

.status {
    background: #172b3a;
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
}

.camera-box {
    position: relative;
    width: 100%;
    max-width: 720px;
    margin: 15px auto;
    background: black;
    border-radius: 10px;
    overflow: hidden;
}

video {
    width: 100%;
    display: block;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

button {
    padding: 12px 16px;
    margin: 5px;
    border: none;
    border-radius: 7px;
    background: #008eb5;
    color: white;
    font-size: 15px;
}

.stop {
    background: #d62828;
}

#detections {
    text-align: left;
    background: #172b3a;
    padding: 12px;
    border-radius: 8px;
    white-space: pre-line;
}

.green {
    color: #00ff99;
}

.red {
    color: #ff6060;
}
</style>
</head>

<body>

<header>
    <h1>Autonomous Vehicle Detection</h1>
    <p>YOLOv8s-World AI Object Detection</p>
</header>

<div class="container">

    <div class="status">
        Model:
        <span id="modelStatus">Loading...</span>
    </div>

    <div class="status">
        Inference Engine:
        <span id="engineStatus">Checking...</span>
    </div>

    <div class="status">
        Bluetooth:
        <span id="bleStatus">Not connected</span>
    </div>

    <div class="status">
        Detection Speed:
        <span id="speedStatus">Waiting</span>
    </div>

    <div class="camera-box">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <button id="startBtn">Start Camera</button>
    <button id="stopBtn">Stop Camera</button>
    <button id="bleBtn">Connect ESP32</button>
    <button id="robotStopBtn" class="stop">STOP ROBOT</button>

    <h3>Detected Objects</h3>

    <div id="detections">
        Waiting for camera...
    </div>

</div>

<script>

// ======================================
// 1. MODEL CONFIGURATION
// ======================================

const MODEL_URL =
"https://huggingface.co/srushti-5/autonomous-vehicle-model/resolve/main/yolov8s-worldv2.onnx";

const INPUT_SIZE = 640;

const CONFIDENCE_THRESHOLD = 0.35;
const IOU_THRESHOLD = 0.45;

// Delay between inference runs
const DETECTION_DELAY_MS = 250;

// Maximum boxes
const MAX_CANDIDATES_FOR_NMS = 300;
const MAX_DISPLAY_BOXES = 30;

// BLE heartbeat
const BLE_HEARTBEAT_MS = 700;


// ======================================
// 2. OBJECT CLASSES
// ======================================

const CLASSES = [
    "person",
    "pedestrian",
    "worker",
    "car",
    "truck",
    "bus",
    "motorcycle",
    "bicycle",
    "tractor",
    "auto rickshaw",
    "dog",
    "cat",
    "cow",
    "buffalo",
    "horse",
    "goat",
    "sheep",
    "elephant",
    "rock",
    "large rock",
    "tree",
    "tree trunk",
    "plant",
    "bush",
    "grass",
    "gravel",
    "fallen tree",
    "branch",
    "road",
    "asphalt",
    "building",
    "wall",
    "fence",
    "pothole"
];


// ======================================
// 3. GLOBAL VARIABLES
// ======================================

let session = null;
let stream = null;

let detecting = false;
let inferenceBusy = false;

let bluetoothDevice = null;
let writeCharacteristic = null;

let lastBleCommand = "";
let lastBleSendTime = 0;

let inferenceCount = 0;
let fpsWindowStart = 0;

let animationTimer = null;

let activeEngine = "unknown";


const video = document.getElementById("video");

const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d");

const detectionsDiv =
document.getElementById("detections");

const modelStatus =
document.getElementById("modelStatus");

const engineStatus =
document.getElementById("engineStatus");

const speedStatus =
document.getElementById("speedStatus");


// ======================================
// 4. BLUETOOTH UUID
// ======================================

const SERVICE_UUID =
"6e400001-b5a3-f393-e0a9-e50e24dcca9e";

const WRITE_UUID =
"6e400002-b5a3-f393-e0a9-e50e24dcca9e";


// ======================================
// 5. REUSABLE PREPROCESSING CANVAS
// ======================================

const inputCanvas = document.createElement("canvas");

inputCanvas.width = INPUT_SIZE;
inputCanvas.height = INPUT_SIZE;

const inputCtx = inputCanvas.getContext("2d", {
    alpha: false,
    willReadFrequently: true
});

const inputBuffer = new Float32Array(
    3 * INPUT_SIZE * INPUT_SIZE
);

const textEncoder = new TextEncoder();


// ======================================
// 6. LOAD ONNX MODEL
// ======================================

async function loadModel() {

    modelStatus.textContent = "Loading model...";

    engineStatus.textContent = "Trying WebGPU...";

    // Try WebGPU first
    if (navigator.gpu) {

        try {

            session =
            await ort.InferenceSession.create(
                MODEL_URL,
                {
                    executionProviders: ["webgpu"],
                    graphOptimizationLevel: "all"
                }
            );

            activeEngine = "WebGPU";

        }

        catch(error) {

            console.warn(
                "WebGPU failed:",
                error
            );

            session = null;

        }

    }

    // Fallback to WASM
    if (!session) {

        try {

            engineStatus.textContent =
            "Loading WASM CPU engine...";

            session =
            await ort.InferenceSession.create(
                MODEL_URL,
                {
                    executionProviders: ["wasm"],
                    graphOptimizationLevel: "all"
                }
            );

            activeEngine = "WASM CPU";

        }

        catch(error) {

            console.error(error);

            modelStatus.textContent =
            "Model loading failed: " + error.message;

            modelStatus.className = "red";

            return;

        }

    }

    modelStatus.textContent = "Loaded successfully";

    modelStatus.className = "green";

    engineStatus.textContent = activeEngine;

    console.log("Model loaded");

    console.log("Inputs:", session.inputNames);

    console.log("Outputs:", session.outputNames);

}


// ======================================
// 7. START CAMERA
// ======================================

async function startCamera() {

    try {

        if (!session) {

            alert("Please wait for the model to load.");

            return;

        }

        if (detecting) return;

        stream =
        await navigator.mediaDevices.getUserMedia({

            video: {

                facingMode: {
                    ideal: "environment"
                },

                width: {
                    ideal: 640
                },

                height: {
                    ideal: 480
                },

                frameRate: {
                    ideal: 15,
                    max: 20
                }

            },

            audio: false

        });

        video.srcObject = stream;

        await video.play();

        canvas.width = video.videoWidth;

        canvas.height = video.videoHeight;

        detecting = true;

        inferenceBusy = false;

        runDetectionLoop();

    }

    catch(error) {

        console.error(error);

        alert("Camera error: " + error.message);

    }

}


// ======================================
// 8. STOP CAMERA
// ======================================

function stopCamera() {

    detecting = false;

    if (animationTimer !== null) {

        clearTimeout(animationTimer);

        animationTimer = null;

    }

    if (stream) {

        stream.getTracks().forEach(
            track => track.stop()
        );

        stream = null;

    }

    video.pause();

    video.srcObject = null;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    speedStatus.textContent = "Stopped";

    detectionsDiv.textContent = "Camera stopped";

    sendCommand("CAMERA_STOPPED", true);

}


// ======================================
// 9. IMAGE PREPROCESSING
// ======================================

function preprocessImage() {

    const sourceWidth = video.videoWidth;

    const sourceHeight = video.videoHeight;

    if (!sourceWidth || !sourceHeight) {

        throw new Error("Camera frame is not ready");

    }

    const scale = Math.min(

        INPUT_SIZE / sourceWidth,

        INPUT_SIZE / sourceHeight

    );

    const resizedWidth =
    Math.round(sourceWidth * scale);

    const resizedHeight =
    Math.round(sourceHeight * scale);

    const padX =
    (INPUT_SIZE - resizedWidth) / 2;

    const padY =
    (INPUT_SIZE - resizedHeight) / 2;

    inputCtx.fillStyle = "black";

    inputCtx.fillRect(
        0,
        0,
        INPUT_SIZE,
        INPUT_SIZE
    );

    inputCtx.drawImage(

        video,

        0,
        0,
        sourceWidth,
        sourceHeight,

        padX,
        padY,
        resizedWidth,
        resizedHeight

    );

    const imageData =
    inputCtx.getImageData(
        0,
        0,
        INPUT_SIZE,
        INPUT_SIZE
    );

    const pixels = imageData.data;

    const plane =
    INPUT_SIZE * INPUT_SIZE;

    for (let i = 0; i < plane; i++) {

        const p = i * 4;

        inputBuffer[i] =
        pixels[p] / 255;

        inputBuffer[plane + i] =
        pixels[p + 1] / 255;

        inputBuffer[2 * plane + i] =
        pixels[p + 2] / 255;

    }

    return {

        tensor: new ort.Tensor(
            "float32",
            inputBuffer,
            [1, 3, INPUT_SIZE, INPUT_SIZE]
        ),

        scale,
        padX,
        padY,
        sourceWidth,
        sourceHeight

    };

}


// ======================================
// 10. IOU CALCULATION
// ======================================

function calculateIoU(a, b) {

    const x1 = Math.max(a.x1, b.x1);

    const y1 = Math.max(a.y1, b.y1);

    const x2 = Math.min(a.x2, b.x2);

    const y2 = Math.min(a.y2, b.y2);

    const intersection =

    Math.max(0, x2 - x1) *

    Math.max(0, y2 - y1);

    const areaA =

    Math.max(0, a.x2 - a.x1) *

    Math.max(0, a.y2 - a.y1);

    const areaB =

    Math.max(0, b.x2 - b.x1) *

    Math.max(0, b.y2 - b.y1);

    return intersection /

    (areaA + areaB - intersection + 1e-6);

}


// ======================================
// 11. NON-MAXIMUM SUPPRESSION
// ======================================

function applyNMS(boxes) {

    boxes.sort(
        (a, b) => b.conf - a.conf
    );

    if (boxes.length > MAX_CANDIDATES_FOR_NMS) {

        boxes.length = MAX_CANDIDATES_FOR_NMS;

    }

    const selected = [];

    for (const box of boxes) {

        let keep = true;

        for (const chosen of selected) {

            if (

                box.classId === chosen.classId &&

                calculateIoU(box, chosen) > IOU_THRESHOLD

            ) {

                keep = false;

                break;

            }

        }

        if (keep) {

            selected.push(box);

        }

        if (selected.length >= MAX_DISPLAY_BOXES) {

            break;

        }

    }

    return selected;

}


// ======================================
// 12. DECODE YOLO OUTPUT
// ======================================

function decodeOutput(output, transform) {

    const data = output.data;

    const dims = output.dims;

    if (!dims || dims.length !== 3) {

        throw new Error(
            "Unexpected ONNX output dimensions: " + dims
        );

    }

    let channels;

    let candidates;

    let channelMajor;

    if (dims[1] === CLASSES.length + 4) {

        channels = dims[1];

        candidates = dims[2];

        channelMajor = true;

    }

    else if (dims[2] === CLASSES.length + 4) {

        candidates = dims[1];

        channels = dims[2];

        channelMajor = false;

    }

    else {

        throw new Error(
            "Unexpected model output shape: " + dims.join("x")
        );

    }

    const {

        scale,
        padX,
        padY,
        sourceWidth,
        sourceHeight

    } = transform;

    const boxes = [];

    for (let i = 0; i < candidates; i++) {

        let maxScore = 0;

        let classId = -1;

        for (let c = 0; c < CLASSES.length; c++) {

            const index = channelMajor

                ? (c + 4) * candidates + i

                : i * channels + c + 4;

            const score = data[index];

            if (score > maxScore) {

                maxScore = score;

                classId = c;

            }

        }

        if (maxScore < CONFIDENCE_THRESHOLD) {

            continue;

        }

        const cx =
        data[channelMajor ? i : i * channels];

        const cy =
        data[channelMajor
            ? candidates + i
            : i * channels + 1];

        const w =
        data[channelMajor
            ? 2 * candidates + i
            : i * channels + 2];

        const h =
        data[channelMajor
            ? 3 * candidates + i
            : i * channels + 3];

        let x1 =
        (cx - w / 2 - padX) / scale;

        let y1 =
        (cy - h / 2 - padY) / scale;

        let x2 =
        (cx + w / 2 - padX) / scale;

        let y2 =
        (cy + h / 2 - padY) / scale;

        x1 = Math.max(
            0,
            Math.min(sourceWidth, x1)
        );

        y1 = Math.max(
            0,
            Math.min(sourceHeight, y1)
        );

        x2 = Math.max(
            0,
            Math.min(sourceWidth, x2)
        );

        y2 = Math.max(
            0,
            Math.min(sourceHeight, y2)
        );

        if (x2 <= x1 || y2 <= y1) {

            continue;

        }

        boxes.push({

            x1,
            y1,
            x2,
            y2,
            conf: maxScore,
            classId

        });

    }

    return applyNMS(boxes);

}


// ======================================
// 13. DRAW DETECTIONS
// ======================================

function drawDetections(boxes) {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    for (const box of boxes) {

        const x = box.x1;

        const y = box.y1;

        const width = box.x2 - box.x1;

        const height = box.y2 - box.y1;

        const name = CLASSES[box.classId];

        const confidence =
        (box.conf * 100).toFixed(1);

        ctx.strokeStyle = "#00ff66";

        ctx.lineWidth = Math.max(
            2,
            canvas.width / 300
        );

        ctx.strokeRect(
            x,
            y,
            width,
            height
        );

        const label =
        name + " " + confidence + "%";

        ctx.font = "bold 16px Arial";

        const textWidth =
        ctx.measureText(label).width;

        const labelY = Math.max(0, y - 24);

        ctx.fillStyle = "#00aa55";

        ctx.fillRect(
            x,
            labelY,
            textWidth + 10,
            24
        );

        ctx.fillStyle = "white";

        ctx.fillText(
            label,
            x + 5,
            Math.max(17, y - 7)
        );

    }

}


// ======================================
// 14. UPDATE DETECTION LIST
// ======================================

function updateDetectionList(boxes) {

    if (boxes.length === 0) {

        detectionsDiv.textContent =
        "No objects detected";

        return;

    }

    detectionsDiv.textContent =
    boxes.map(box => {

        return (

            CLASSES[box.classId] +

            " - " +

            (box.conf * 100).toFixed(1) +

            "%"

        );

    }).join("\n");

}


// ======================================
// 15. DETECTION LOOP
// ======================================

async function runDetectionLoop() {

    if (
        !detecting ||
        !session ||
        inferenceBusy
    ) {

        return;

    }

    inferenceBusy = true;

    const startTime = performance.now();

    try {

        if (
            video.readyState >=
            HTMLMediaElement.HAVE_CURRENT_DATA
        ) {

            const processed = preprocessImage();

            const feeds = {};

            feeds[session.inputNames[0]] =
            processed.tensor;

            const results =
            await session.run(feeds);

            const output =
            results[session.outputNames[0]];

            const boxes =
            decodeOutput(output, processed);

            drawDetections(boxes);

            updateDetectionList(boxes);

            // Send only strongest object
            let command = "CLEAR";

            if (boxes.length > 0) {

                const best = boxes[0];

                command =

                "DETECT:" +

                CLASSES[best.classId] +

                ":" +

                best.conf.toFixed(3);

            }

            await sendCommand(command);

            // Calculate detection speed
            inferenceCount++;

            const now = performance.now();

            if (!fpsWindowStart) {

                fpsWindowStart = now;

            }

            if (now - fpsWindowStart >= 2000) {

                const fps =

                inferenceCount * 1000 /

                (now - fpsWindowStart);

                speedStatus.textContent =

                fps.toFixed(1) +

                " detections/sec | " +

                (performance.now() - startTime)
                .toFixed(0) +

                " ms/inference";

                inferenceCount = 0;

                fpsWindowStart = now;

            }

        }

    }

    catch(error) {

        console.error(
            "Detection error:",
            error
        );

        modelStatus.textContent =
        "Detection error: " + error.message;

        modelStatus.className = "red";

        detecting = false;

        return;

    }

    finally {

        inferenceBusy = false;

    }

    if (detecting) {

        animationTimer = setTimeout(
            runDetectionLoop,
            DETECTION_DELAY_MS
        );

    }

}


// ======================================
// 16. BLUETOOTH CONNECTION
// ======================================

async function connectBluetooth() {

    try {

        if (!navigator.bluetooth) {

            alert(
                "Web Bluetooth is not supported in this browser."
            );

            return;

        }

        bluetoothDevice =
        await navigator.bluetooth.requestDevice({

            filters: [
                { name: "Robot_Receiver" }
            ],

            optionalServices: [SERVICE_UUID]

        });

        bluetoothDevice.addEventListener(
            "gattserverdisconnected",
            () => {

                writeCharacteristic = null;

                document.getElementById(
                    "bleStatus"
                ).textContent = "Disconnected";

                document.getElementById(
                    "bleStatus"
                ).className = "red";

            }
        );

        const server =
        await bluetoothDevice.gatt.connect();

        const service =
        await server.getPrimaryService(SERVICE_UUID);

        writeCharacteristic =
        await service.getCharacteristic(WRITE_UUID);

        document.getElementById(
            "bleStatus"
        ).textContent = "Connected to Robot_Receiver";

        document.getElementById(
            "bleStatus"
        ).className = "green";

    }

    catch(error) {

        console.error(error);

        alert(
            "Bluetooth connection failed: " +
            error.message
        );

    }

}


// ======================================
// 17. SEND BLUETOOTH COMMAND
// ======================================

async function sendCommand(command, force = false) {

    if (!writeCharacteristic) return;

    const now = Date.now();

    const changed =
    command !== lastBleCommand;

    const heartbeatDue =
    now - lastBleSendTime >= BLE_HEARTBEAT_MS;

    if (
        !force &&
        !changed &&
        !heartbeatDue
    ) {

        return;

    }

    try {

        const data =
        textEncoder.encode(command + "\n");

        if (writeCharacteristic.properties.write) {

            await writeCharacteristic.writeValueWithResponse(
                data
            );

        }

        else if (
            writeCharacteristic.properties.writeWithoutResponse
        ) {

            await writeCharacteristic.writeValueWithoutResponse(
                data
            );

        }

        else {

            throw new Error(
                "BLE characteristic does not support writing"
            );

        }

        lastBleCommand = command;

        lastBleSendTime = Date.now();

        console.log("BLE sent:", command);

    }

    catch(error) {

        console.error(
            "BLE send error:",
            error
        );

    }

}


// ======================================
// 18. STOP ROBOT
// ======================================

async function sendStop() {

    await sendCommand("STOP", true);

}


// ======================================
// 19. INITIALIZATION
// ======================================

document.getElementById("startBtn")
.addEventListener("click", startCamera);

document.getElementById("stopBtn")
.addEventListener("click", stopCamera);

document.getElementById("bleBtn")
.addEventListener("click", connectBluetooth);

document.getElementById("robotStopBtn")
.addEventListener("click", sendStop);

loadModel();

</script>

</body>
</html>
